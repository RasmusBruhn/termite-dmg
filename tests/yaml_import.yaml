data_types:
  PositiveDouble:
    data: !ConstrainedType
      data_type: number
      constraints:
      - !Arithmetic x > 0.0
  Point:
    description: A point in 2D space
    data: !Struct
      fields:
        x:
          data_type: number
          default: !Default 0.0
        y:
          data_type: number
          default: !Default $DEFAULT_COORDINATE$
        id:
          data_type: integer
          default: Optional
  Size:
    description: The size of a box
    data: !Struct
      fields:
        w:
          description: The width
          data_type: PositiveDouble
          default: Required
        h:
          description: The height
          data_type: PositiveDouble
          default: Required
  SizeVariant:
    description: Is either a Size or just a PositiveDouble if it is a square
    data: !Variant
      data_types:
      - PositiveDouble
      - Size
  SizeArray:
    data: !Array
      data_type: SizeVariant
  Geometry:
    data: !Enum
      types:
      - name: Nothing
        description: No geometry
      - name: Sizes
        description: A number of sizes
        data_type: SizeArray
      - name: Point
        description: A point
        data_type: Point
  NamedGeometry:
    data: !Struct
      fields:
        geometry:
          description: The geometry data
          data_type: Geometry
          default: !Default
            Point:
              x: 1.0
              id: 0
        name:
          description: The name of the geometry
          data_type: string
          default: Required
headers:
  cpp-header: "// My .h Header with message: $MESSAGE$"
  cpp-source: "// My .cpp Header and this is a dollar sign: $$"
footers:
  cpp-header: // My .h Footer
  cpp-source: // My .cpp Footer
macros:
  DEFAULT_COORDINATE: 0.0
  MESSAGE: This is a macro message
namespace:
- my_namespace
