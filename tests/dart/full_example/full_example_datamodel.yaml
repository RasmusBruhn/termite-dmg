macros:
  State:
    Edge: 1
  VersionMajor: 1
  VersionMinor: 0
  VersionPatch: 0
namespace:
- test
- name
- space
headers:
  dart: |
    // This is my .dart file
    import '../custom.dart' as custom;
footers:
  dart: // This is the end of my .dart file
data_types:
  VersionString:
    description: A string that represents a version number
    data: !ConstrainedType
      data_type: string
      constraints:
      - !Function custom::is_valid_version_string
  SizeValue:
    description: A single size value
    data: !ConstrainedType
      data_type: integer
      constraints:
      - !Arithmetic x > 0
  Size:
    description: The size of a geometry
    data: !Struct
      fields:
      - name: w
        description: The width of the geometry
        data_type: SizeValue
        default: Required
      - name: h
        description: The height of the geometry
        data_type: SizeValue
        default: Required
  Point:
    description: A point in 2D space
    data: !Struct
      fields:
      - name: x
        description: The x coordinate of the point
        data_type: integer
        default: Required
      - name: y
        description: The y coordinate of the point
        data_type: integer
        default: Required
  State:
    description: The state of a geometry
    data: !Enum
      types:
      - name: Filled
        description: The geometry is filled
      - name: Edge
        description: The geometry is inactive
        data_type: SizeValue
  DefaultValues:
    description: All global default values
    data: !Struct
      fields:
      - name: state
        description: The state of a geometry
        data_type: State
        default: !Default $State$
      - name: size
        description: The default size of the geometry
        data_type: Size
        default: Required
  Rectangle:
    description: A rectangle geometry
    data: !Struct
      fields:
      - name: center
        description: The center point of the rectangle
        data_type: Point
        default: Required
      - name: size
        description: The size of the rectangle
        data_type: Size
        default: Optional
      - name: state
        description: The state of the circle
        data_type: State
        default: Optional
  Circle:
    description: A circle geometry
    data: !Struct
      fields:
      - name: center
        description: The center point of the circle
        data_type: Point
        default: Required
      - name: radius
        description: The radius of the circle
        data_type: SizeValue
        default: Required
      - name: state
        description: The state of the circle
        data_type: State
        default: Optional
  Geometry:
    description: A geometry that can be a rectangle or a circle
    data: !Variant
      data_types:
      - Circle
      - Rectangle
  GeometryList:
    description: A list of geometries
    data: !Array
      data_type: Geometry
  DataModel:
    description: The main data model
    data: !Struct
      fields:
      - name: version
        description: The version string for the data model
        data_type: VersionString
        default: !Default $VersionMajor$.$VersionMinor$.$VersionPatch$
      - name: defaults
        description: The default values for the data model
        data_type: DefaultValues
        default: Required
      - name: geometries
        description: A list of geometries
        data_type: GeometryList
        default: Required
